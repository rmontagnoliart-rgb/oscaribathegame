<script>
function testSound() {
  const status = document.getElementById('status');
  const audio = document.getElementById('testAudio');
  
  status.innerHTML = '⏳ Tentando tocar som...';
  
  if(!audio) {
    status.innerHTML = '❌ Elemento de áudio não encontrado!';
    return;
  }
  
  try {
    audio.currentTime = 0;
    const playPromise = audio.play();
    
    if(playPromise !== undefined) {
      playPromise
        .then(() => {
          status.innerHTML = '✅ SOM TOCANDO! Se você ouviu, o problema está resolvido!';
        })
        .catch(error => {
          status.innerHTML = '🔊 Áudio bloqueado: ' + error.message + '<br>Tenta clicar no botão novamente.';
        });
    } else {
      status.innerHTML = '✅ SOM TOCANDO (navegador antigo)!';
    }
  } catch(e) {
    status.innerHTML = '❌ Erro: ' + e.message;
  }
}
</script>
